# Live-test copy of examples/shared-library/success/migration/workflow.yml.
#
# GitHub Actions discovers workflows only in the repository root
# .github/workflows/ directory. examples/shared-library/success/migration/workflow.yml
# is the unmodified pipebridge output and is not a live workflow.
#
# Documented adjustments from the generated workflow:
# 1. Distinct workflow `name:` for clear identification in GitHub Actions.
# 2. Added `Verify restored file bytes` step after `Restore (step 3)` to assert
#    exact byte contents of `dist/marker.txt` and `dist/seen.txt`.
# 3. Added `Verify pipebridge stash cleanup` (`if: always()`) after `Remove pipebridge stash`
#    to prove `$RUNNER_TEMP/pipebridge-stash` was removed.
# No `defaults.run.working-directory` override is set; scripts run from `$GITHUB_WORKSPACE`.
#
# Source: examples/shared-library/success/Jenkinsfile (sha256: 623adc9f56a9df89076ea261ace58d088ed3fcdeb2c04795bdd097a6328dc85a)
# Generated by pipebridge 0.5.0, then adjusted as described above.

name: Shared-library success example (live validation)
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash

jobs:
  migrated-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout source (implicit)"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (pinned to full commit SHA)
      - name: Publish
        run: |2-
          bash --noprofile --norc -eo pipefail 'examples/shared-library/success/migration/scripts/build-lib/publish/packageSources-1.sh' 'packaged'
      - name: "Publish (step 2)"
        env:
          NPM_TOKEN: "${{ secrets.NPM_TOKEN_GH }}"
        run: |2-
          bash --noprofile --norc -eo pipefail 'examples/shared-library/success/migration/scripts/build-lib/publish/call-1.sh'
      - name: "Publish (step 3)"
        run: |2-
          python3 'examples/shared-library/success/migration/scripts/pipebridge_stash.py' 'dist' 'dist/**'
      - name: Restore
        run: |2-
          rm -rf dist
      - name: "Restore (step 2)"
        run: |2-
          python3 'examples/shared-library/success/migration/scripts/pipebridge_unstash.py' 'dist'
      - name: "Restore (step 3)"
        run: |2-
          test -f dist/marker.txt && grep -qx packaged dist/marker.txt && test -f dist/seen.txt
      - name: Verify restored file bytes
        run: |2-
          python3 -c 'from pathlib import Path; assert Path("dist/marker.txt").read_bytes() == b"packaged"; assert Path("dist/seen.txt").read_bytes() == b"ok"'
      - name: Remove pipebridge stash
        if: always()
        continue-on-error: true
        run: python3 -c 'import os, shutil; root=os.path.join(os.environ["RUNNER_TEMP"], "pipebridge-stash"); shutil.rmtree(root, ignore_errors=True)'
      - name: Verify pipebridge stash cleanup
        if: always()
        run: |2-
          python3 -c 'import os, sys; root=os.path.join(os.environ["RUNNER_TEMP"], "pipebridge-stash"); sys.exit(1 if os.path.exists(root) else 0)'
