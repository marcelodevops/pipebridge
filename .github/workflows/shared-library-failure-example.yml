# Live-test copy of examples/shared-library/failure/migration/workflow.yml.
#
# GitHub Actions discovers workflows only in the repository root
# .github/workflows/ directory. examples/shared-library/failure/migration/workflow.yml
# is the unmodified pipebridge output and is not a live workflow.
#
# Documented adjustments from the generated workflow:
# 1. Distinct workflow `name:` for clear identification in GitHub Actions.
# 2. Added `Verify pipebridge stash cleanup` (`if: always()`) after `Remove pipebridge stash`
#    to prove `$RUNNER_TEMP/pipebridge-stash` was removed even after failure.
# No `defaults.run.working-directory` override is set; scripts run from `$GITHUB_WORKSPACE`.
#
# Source: examples/shared-library/failure/Jenkinsfile (sha256: 0a04f3dd51aca3fef26c9b7622f374481ec71dd1f416f8b6dd00ebdeac3ccf99)
# Generated by pipebridge 0.5.0, then adjusted as described above.

name: Shared-library failure example (live validation)
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash

jobs:
  migrated-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout source (implicit)"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (pinned to full commit SHA)
      - name: Fail
        run: |2-
          bash --noprofile --norc -eo pipefail 'examples/shared-library/failure/migration/scripts/build-lib/publish/call-1.sh'
      - name: "Fail (step 2)"
        run: |2-
          bash --noprofile --norc -eo pipefail 'examples/shared-library/failure/migration/scripts/build-lib/publish/call-2.sh'
      - name: "Fail (step 3)"
        run: |2-
          python3 'examples/shared-library/failure/migration/scripts/pipebridge_stash.py' 'dist' 'marker.txt'
      - name: Restore
        run: |2-
          python3 'examples/shared-library/failure/migration/scripts/pipebridge_unstash.py' 'dist'
      - name: "Restore (step 2)"
        run: |2-
          echo restored
      - name: Remove pipebridge stash
        if: always()
        continue-on-error: true
        run: python3 -c 'import os, shutil; root=os.path.join(os.environ["RUNNER_TEMP"], "pipebridge-stash"); shutil.rmtree(root, ignore_errors=True)'
      - name: Verify pipebridge stash cleanup
        if: always()
        run: |2-
          python3 -c 'import os, sys; root=os.path.join(os.environ["RUNNER_TEMP"], "pipebridge-stash"); sys.exit(1 if os.path.exists(root) else 0)'
