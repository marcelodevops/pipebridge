[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pipebridge"
description = "Migrate declarative Jenkins pipelines to GitHub Actions workflows with actionable, honest migration reports."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "pipebridge contributors" }]
dependencies = ["PyYAML>=6.0"]
dynamic = ["version"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]

[project.scripts]
pipebridge = "pipebridge.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "pipebridge.__version__" }
